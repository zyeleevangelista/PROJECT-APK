name: Build Lock Video Recorder APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Locate Android source
        shell: bash
        run: |
          set -euo pipefail
          for archive in LockVideoRecorder-GitHub-Upload.zip LockVideoRecorder-Android-project.zip; do
            if [ -f "$archive" ]; then
              echo "Extracting $archive"
              unzip -q -o "$archive"
              break
            fi
          done

          if [ -f "LockVideoRecorder/app/build.gradle" ]; then
            echo "project_dir=LockVideoRecorder" >> "$GITHUB_ENV"
          elif [ -f "app/build.gradle" ]; then
            echo "project_dir=." >> "$GITHUB_ENV"
          else
            echo "::error::Android app sources are missing. Upload the project ZIP to the repository root."
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 35
        shell: bash
        run: |
          sdkmanager --version
          sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p "$project_dir" :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LockVideoRecorder-debug-APK
          path: ${{ env.project_dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
