name: Build Lock Video Recorder APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-latest
    env:
      HAS_UPLOAD_KEY: ${{ secrets.LVR_KEYSTORE_BASE64 != '' }}
      LVR_KEYSTORE_PASSWORD: ${{ secrets.LVR_KEYSTORE_PASSWORD }}
      LVR_KEY_ALIAS: ${{ secrets.LVR_KEY_ALIAS }}
      LVR_KEY_PASSWORD: ${{ secrets.LVR_KEY_PASSWORD }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Locate Android source
        shell: bash
        run: |
          set -euo pipefail
          for archive in LockVideoRecorder-GitHub-Upload.zip LockVideoRecorder-Android-project.zip; do
            if [ -f "$archive" ]; then
              echo "Extracting $archive"
              unzip -q -o "$archive"
              break
            fi
          done

          if [ -f "LockVideoRecorder/app/build.gradle" ]; then
            echo "project_dir=LockVideoRecorder" >> "$GITHUB_ENV"
          elif [ -f "app/build.gradle" ]; then
            echo "project_dir=." >> "$GITHUB_ENV"
          else
            echo "::error::Android app sources are missing. Upload the project ZIP to the repository root."
            exit 1
          fi

      - name: Apply premium upgrade
        run: python3 premium/apply_premium.py "$project_dir"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 35
        shell: bash
        run: |
          sdkmanager --version
          sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build APK
        run: gradle -p "$project_dir" :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LockVideoRecorder-debug-APK
          path: ${{ env.project_dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Import private Play upload key
        if: env.HAS_UPLOAD_KEY == 'true'
        shell: bash
        env:
          UPLOAD_KEY_BASE64: ${{ secrets.LVR_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$UPLOAD_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/lock-video-upload.jks"
          echo "LVR_KEYSTORE_PATH=$RUNNER_TEMP/lock-video-upload.jks" >> "$GITHUB_ENV"

      - name: Build signed Google Play bundle
        if: env.HAS_UPLOAD_KEY == 'true'
        run: gradle -p "$project_dir" :app:bundleRelease --no-daemon --stacktrace

      - name: Upload signed Play Store AAB
        if: env.HAS_UPLOAD_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: LockVideoRecorder-Premium-Play-AAB
          path: ${{ env.project_dir }}/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
